<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
      // Extract the path after the base URL
      const path = window.location.pathname.split('/').pop();

      // If there’s a userId-like path, redirect to index with query param
      if (path && path !== '404.html' && path !== 'index.html') {
        const newUrl = window.location.origin + window.location.pathname.replace(path, '') + '?userId=' + path;
        window.location.replace(newUrl);
      } else {
        window.location.replace(window.location.origin + window.location.pathname.replace('404.html', ''));
      }
    </script>
  </head>
  <body></body>
</html>

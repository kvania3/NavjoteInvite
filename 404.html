<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
      const path = window.location.pathname.split('/').filter(Boolean).pop();
      if (path && path !== '404.html' && path !== 'index.html') {
        const base = window.location.origin + window.location.pathname.replace(path, '');
        const newUrl = base + '?userId=' + path;
        window.location.replace(newUrl);
      } else {
        window.location.replace(window.location.origin + window.location.pathname.replace('404.html', ''));
      }
    </script>
  </head>
  <body></body>
</html>

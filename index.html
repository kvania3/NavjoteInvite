<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
    iframe { width: 80%; height: 80vh; border: none; margin-top: 20px; }
    .error { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Your Personalized Invitation</h1>
  <div id="viewer"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');

    if (!userId) {
      document.getElementById('viewer').innerHTML = '<p class="error">No userId provided in URL!</p>';
    } else {
      fetch('data.json')
        .then(res => res.json())
        .then(data => {
          const pdfPath = data[userId];
          if (!pdfPath) {
            document.getElementById('viewer').innerHTML = '<p class="error">Invalid userId!</p>';
          } else {
			const pdfUrl = `${user.pdf}#toolbar=0&navpanes=0&scrollbar=0`;
            document.getElementById('viewer').innerHTML = `
              iframe src="${pdfUrl}" allow="fullscreen"></iframe>`;
          }
        })
        .catch(err => {
          document.getElementById('viewer').innerHTML = '<p class="error">Error loading invitation.</p>';
          console.error(err);
        });
    }
  </script>
</body>
</html>

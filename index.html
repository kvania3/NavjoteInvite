<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
    iframe { width: 80%; height: 80vh; border: none; margin-top: 20px; }
    .error { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Your Personalized Invitation</h1>
  <div id="viewer"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('userId');
    const viewer = document.getElementById('viewer');

    if (userId) {
      showInvite(userId);
    } else {
      viewer.innerHTML = '<p>Welcome! Please use your personalized link.</p>';
    }

    function showInvite(id) {
      fetch('data.json')
        .then(r => r.json())
        .then(data => {
          const pdf = data[id];
          if (!pdf) {
            viewer.innerHTML = '<p class="error">Invalid invitation link!</p>';
          } else {
            viewer.innerHTML = `<iframe src="${pdf}"></iframe>`;
          }
        })
        .catch(() => viewer.innerHTML = '<p class="error">Error loading invite.</p>');
    }
  </script>
</body>
</html>

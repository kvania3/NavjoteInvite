<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite Viewer</title>
  <style>
    body { 
      font-family: sans-serif; 
      text-align: center; 
      padding: 50px; 
      background: #f8f8f8;
    }
    iframe { 
      width: 80%; 
      height: 80vh; 
      border: none; 
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      border-radius: 12px;
    }
    .error { 
      color: red; 
      font-weight: bold; 
    }
  </style>
</head>
<body>
  <h1>Your Invitation</h1>
  <div id="viewer"></div>

  <script>
    // Get userId from URL
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');
    const viewerDiv = document.getElementById('viewer');

    if (!userId) {
      viewerDiv.innerHTML = '<p class="error">No userId provided!</p>';
    } else {
      fetch('data.json')
        .then(res => res.json())
        .then(data => {
          const pdfPath = data[userId];
          if (!pdfPath) {
            viewerDiv.innerHTML = '<p class="error">Invalid userId!</p>';
          } else {
            // Hide toolbar and UI
            const pdfUrl = `${pdfPath}#toolbar=0&navpanes=0&scrollbar=0`;
            viewerDiv.innerHTML = `
              <iframe src="${pdfUrl}" allowfullscreen></iframe>
            `;
          }
        })
        .catch(err => {
          viewerDiv.innerHTML = '<p class="error">Error loading data.</p>';
          console.error(err);
        });
    }
  </script>
</body>
</html>
